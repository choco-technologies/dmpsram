; External octal PSRAM of the Elecrow DIS08070H (CrowPanel ESP32 HMI 7.0", ESP32-S3-WROOM-1-N4R8: 8 MB, AP Memory).
;
; Two sections: the controller (dmqspi, whose pads are the fixed pads of the memory SPI, so no pins are listed) and the chip (this
; driver, qspi_instance = the `instance` of the controller). The controller is started first (driver_order, and this driver requires
; the dmqspi module): the chip has to be a heap before the drivers that follow it are created, so it is not waited for as a friend.
;
; Needs the PLL of dmclk up before (the clock of the PSRAM comes from the APB clock).
;
; heap_usage=heap: the memory is a default heap, and the newest one - allocations that name no heap try it first
; (none: not a heap; tagged: a heap that only the callers asking for the tag "psram" get memory from).

[psram_qspi]
driver_name=dmqspi
driver_order=-6
instance=1
; chip select 1: the chip select 0 is the flash the firmware runs from
bank=2
data_lines=8
; 80 MHz DDR (about 160 MB/s; needs dmqspi with the tuning of the 80 MHz): the frame buffer of the display (800x480 RGB565, 24 MB/s at the
; 12 MHz pixel clock of the panel) is scanned out of this memory. dmqspi tunes the sampling of the data when the window is mapped and falls back
; to 40 MHz if nothing reads back. The core clock of the memory SPI goes to 160 MHz then: the flash the firmware runs from (a GD25Q32 with its
; QE bit set) is read at 80 MHz with four lines - the display loses much less to the reads of the flash than with two lines at 40 MHz.
clock_hz=80000000
boot_flash_clock_hz=80000000
boot_flash_lines=4
flash_size=8388608
cs_high_cycles=2

[dmpsram]
driver_name=dmpsram
driver_order=-5
qspi_instance=1
mode=octal
heap_usage=heap
heap_alignment=16
; Write patterns to the memory and read them back before it is used
verify=on
