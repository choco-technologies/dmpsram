; External octal PSRAM of the ESP32-S3 2.8" display board (ESP32-S3FN16R8: 8 MB, AP Memory).
;
; Two sections: the controller (dmqspi, whose pads are the fixed pads of the memory SPI, so no pins are listed) and the chip (this
; driver, qspi_instance = the `instance` of the controller). The controller is started first (driver_order, and this driver requires
; the dmqspi module): the chip has to be a heap before the drivers that follow it are created, so it is not waited for as a friend.
;
; Needs the PLL of dmclk up before (the clock of the PSRAM comes from the APB clock).
;
; heap_usage=heap: the memory is a default heap, and the newest one - allocations that name no heap try it first
; (none: not a heap; tagged: a heap that only the callers asking for the tag "psram" get memory from).

[psram_qspi]
driver_name=dmqspi
driver_order=-6
instance=1
; chip select 1: the chip select 0 is the flash the firmware runs from
bank=2
data_lines=8
; Only 20 MHz for now (the timing of the memory SPI is not tuned for more)
clock_hz=20000000
flash_size=8388608
cs_high_cycles=2

[dmpsram]
driver_name=dmpsram
driver_order=-5
qspi_instance=1
mode=octal
heap_usage=heap
heap_alignment=16
; Write patterns to the memory and read them back before it is used
verify=on
